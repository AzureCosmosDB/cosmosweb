name: Deploy Docusaurus to App Service Slot

on:
  push:
    branches:
      - v2  # Trigger deployment when you push to the v2 branch

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read   # Needed for checking out the repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        cd client
        npm install --legacy-peer-deps

    - name: Build Docusaurus
      run: |
        cd client
        npm run build  # Builds the static site, output is in client/build

    # ✅ Azure Login using OIDC
    - name: Login to Azure using OIDC
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # ✅ Deploy to Azure Web App
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: cosmos-web
        package: ./client/build
      env:
        DEBUG: true  # Enable debug logging to capture more details
