name: OIDC managed identity login-only test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  login-only:
    if: github.repository == 'AzureCosmosDB/cosmosweb' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    steps:
    - name: Verify authorized subscription
      shell: bash
      env:
        CONFIGURED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        if [ "$CONFIGURED_SUBSCRIPTION_ID" != "220fc532-6091-423c-8ba0-66c2397d591b" ]; then
          echo "::error::Configured subscription does not match the authorized subscription."
          exit 1
        fi

    - name: Login with isolated managed identity
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        client-id: 64ed969b-4830-4d7c-851a-f55947c942b9
        tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
        allow-no-subscriptions: true

    - name: Confirm token issuance without resource access
      run: >-
        az account get-access-token
        --tenant 72f988bf-86f1-41af-91ab-2d7cd011db47
        --resource https://management.azure.com/
        --query '{tenant:tenant,expiresOn:expiresOn}'
        --output json