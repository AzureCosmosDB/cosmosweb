name: OIDC login-only test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  login-only:
    if: github.repository == 'AzureCosmosDB/cosmosweb' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    steps:
    - name: Verify authorized subscription
      shell: bash
      env:
        CONFIGURED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        if [ "$CONFIGURED_SUBSCRIPTION_ID" != "220fc532-6091-423c-8ba0-66c2397d591b" ]; then
          echo "::error::Configured subscription does not match the authorized subscription."
          exit 1
        fi

    - name: Login to Azure using OIDC v2
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Confirm authenticated subscription
      run: >-
        az account show
        --subscription 220fc532-6091-423c-8ba0-66c2397d591b
        --query '{subscriptionId:id,tenantId:tenantId}'
        --output json